name: Scheduled API calls

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  call-api:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://api.github.com/zen' }}
    steps:
      - name: Call API 10 times
        run: |
          for i in $(seq 1 10); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$API_URL")
            echo "Call $i: HTTP $status"
          done
